<!doctype html>
<html lang="tl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Kausap si Claude</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"
        }
      }
    </script>
    <style>
      @font-face {
        font-family: "Gelasio";
        src: url("assets/fonts/Gelasio.ttf") format("truetype");
        font-weight: 400 700;
      }
      @font-face {
        font-family: "Fraunces";
        src: url("assets/fonts/Fraunces.ttf") format("truetype");
        font-weight: 100 900;
      }
      body {
        margin: 0;
        background: #1b1638;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1b1638;
      }
      .layer {
        position: absolute;
        inset: 0;
      }
      /* The scene is drawn small and scaled up without smoothing: that is the whole pixel look. */
      #three-layer {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        display: block;
        image-rendering: pixelated;
      }
      #cap {
        position: absolute;
        left: 90px;
        width: 900px;
        top: 470px;
        text-align: center;
        font-family: "Gelasio", serif;
        font-weight: 700;
        font-size: 58px;
        line-height: 1.18;
        white-space: pre-line;
        color: #ffffff;
        -webkit-text-stroke: 5px rgba(18, 10, 34, 0.92);
        paint-order: stroke fill;
        text-shadow:
          0 4px 5px rgba(0, 0, 0, 0.82),
          0 0 16px rgba(10, 6, 24, 0.78);
      }
      /* The closing card, layout C1 "Logo up" (SPEC-C1.md; the reference is kami_c_variants.mjs, C1). Every box is absolute on the 1080x1920 frame. */
      #endcard {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        opacity: 0;
      }
      /* the logo: its PNG is 2560x1080 with transparent padding, so this wrapper shows only the opaque pixels (x 39-2452, y 316-766) at 860 px wide, top y 290 */
      #endlogo {
        position: absolute;
        left: 110px;
        top: 290px;
        width: 860px;
        height: 160.38px;
        overflow: hidden;
      }
      #endlogo img {
        position: absolute;
        left: -13.9px;
        top: -112.62px;
        width: 912.39px;
        height: 384.92px;
        max-width: none;
      }
      /* the message: Kami yellow in the reel caption's style; fitEndMessage() in src/lib/50-direct.js sets its size and its middle (y 880) */
      #endline {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: "Fraunces", serif;
        font-weight: 700;
        font-size: 108px;
        line-height: 1.1;
        color: #ffd65a;
        -webkit-text-stroke: 6.92px rgba(18, 10, 34, 0.92);
        paint-order: stroke fill;
        text-shadow: 0 4px 5px rgba(0, 0, 0, 0.82), 0 0 16px rgba(10, 6, 24, 0.78);
      }
      #endline span {
        display: block;
        height: 1.1em;
        white-space: nowrap;
      }
      /* the handle row (series.json card.handle): a 60 px row whose middle is at y 1130 */
      #endhandle {
        position: absolute;
        left: 0;
        top: 1100px;
        width: 1080px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        white-space: nowrap;
        font-family: "Fraunces", serif;
        font-weight: 600;
        font-size: 46px;
        line-height: 54px;
        color: #f4efff;
      }
      /* the credit label (series.json card.credit.label): a 40 px box whose top is at y 1279 */
      #endby {
        position: absolute;
        left: 0;
        top: 1279px;
        width: 1080px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        font-family: "Gelasio", serif;
        font-weight: 400;
        font-size: 26px;
        line-height: 32px;
        color: #d9d0f2;
        text-shadow: 0 3px 4px rgba(0, 0, 0, 0.6);
      }
      /* the creator chip: a 132 px pill whose middle is at y 1395; the avatar, name and handle come from series.json card.credit */
      #endchip {
        position: absolute;
        left: 0;
        top: 1329px;
        width: 1080px;
        height: 132px;
        display: flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
      }
      #chip {
        display: flex;
        align-items: center;
        box-sizing: border-box;
        height: 132px;
        padding: 18px 40px 18px 18px;
        border-radius: 66px;
        background: rgba(20, 14, 40, 0.62);
        box-shadow: inset 0 0 0 2px rgba(244, 239, 255, 0.28);
      }
      #endavatar {
        width: 96px;
        height: 96px;
        display: block;
        flex: none;
        border-radius: 50%;
        background: #f4efff;
        box-shadow: 0 0 0 3px #f4efff, 0 5px 12px rgba(0, 0, 0, 0.45);
      }
      #chip .who {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        margin-left: 22px;
        text-shadow: 0 3px 4px rgba(0, 0, 0, 0.6);
      }
      #chip .name {
        font-family: "Fraunces", serif;
        font-weight: 700;
        font-size: 44px;
        line-height: 50px;
        color: #ffffff;
        white-space: nowrap;
      }
      #chip .ig {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-family: "Fraunces", serif;
        font-weight: 600;
        font-size: 32px;
        line-height: 38px;
        color: #f4efff;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="1080" data-height="1920">
      <div id="scene" class="clip layer" data-start="0" data-duration="__DUR__" data-track-index="0">
        <canvas id="three-layer" width="360" height="640"></canvas>
      </div>
      <div id="captions" class="clip layer" data-start="0" data-duration="__DUR__" data-track-index="1">
        <div id="cap"></div>
      </div>
      <div id="end" class="clip layer" data-start="0" data-duration="__DUR__" data-track-index="2">
        <div id="endcard">
          <!--ENDLOGO--><!--/ENDLOGO-->
          <div id="endline"><!--ENDLINE--><span>Bago mag-build,</span><span>magtanong muna.</span><!--/ENDLINE--></div>
          <!--ENDHANDLE--><!--/ENDHANDLE-->
          <!--ENDCREDIT--><!--/ENDCREDIT-->
        </div>
      </div>
      <audio id="mix" src="assets/audio/mix.mp3" data-start="0" data-duration="__DUR__" data-track-index="5" data-volume="1"></audio>
    </div>
    <script>
      window.TL = /*__TL__*/;
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: window.TL.dur }, 0);
      window.__timelines["main"] = tl;
    </script>
    <script type="module">
/*__SCENE__*/
    </script>
  </body>
</html>
